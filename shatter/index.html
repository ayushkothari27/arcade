<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1A1A2E">
  <title>Shatter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;1,9..144,400&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #1A1A2E;
      --orange:  #C8572E;
      --yellow:  #C99A30;
      --green:   #3A8F72;
      --indigo:  #6366F1;
      --pink:    #B85C8A;
      --muted:   #9CA3AF;
      --surface: rgba(255,255,255,0.05);
      --border:  rgba(255,255,255,0.09);
      --text:    #F9FAFB;
    }

    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas { display: block; position: fixed; inset: 0; width: 100vw; height: 100svh; }

    .back {
      position: fixed;
      top: max(12px, env(safe-area-inset-top, 0px));
      left: 14px;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.8rem;
      z-index: 20;
    }
    .back:hover { color: var(--text); }

    #overlay {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      padding: 16px;
      background: rgba(26,26,46,0.6);
      backdrop-filter: blur(3px);
      z-index: 10;
    }
    #overlay.hidden { display: none; }

    .card {
      position: relative;
      width: min(380px, 100%);
      background: rgba(26,26,46,0.96);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 1.8rem 1.5rem 1.5rem;
      text-align: center;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      width: 260px; height: 260px;
      top: -130px; right: -100px;
      background: var(--orange);
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.2;
      pointer-events: none;
    }
    .card h1 {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 2.2rem;
      letter-spacing: -0.01em;
      margin-bottom: 0.3rem;
    }
    .card h1 em { font-style: italic; font-weight: 400; color: var(--yellow); }
    .sub { color: var(--muted); font-size: 0.88rem; margin-bottom: 1.2rem; }

    .legend {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem 0.8rem;
      text-align: left;
      font-size: 0.78rem;
      margin-bottom: 1.3rem;
    }
    .legend div { display: flex; align-items: center; gap: 0.5rem; }
    .pill {
      flex-shrink: 0;
      width: 30px; height: 15px;
      border-radius: 8px;
      font-size: 0.6rem;
      font-weight: 700;
      display: inline-flex; align-items: center; justify-content: center;
      color: #1A1A2E;
    }

    .lines { display: grid; gap: 0.35rem; margin: 0 0 1.2rem; font-size: 0.9rem; }
    .lines div { display: flex; justify-content: space-between; color: var(--muted); }
    .lines div span:last-child { color: var(--text); font-weight: 600; }

    .btns { display: flex; gap: 0.6rem; justify-content: center; flex-wrap: wrap; }
    .btn {
      padding: 0.75rem 1.7rem;
      border-radius: 999px;
      border: none;
      background: var(--orange);
      color: var(--text);
      font: inherit; font-weight: 600; font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.12s ease, filter 0.12s ease;
    }
    .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .btn.ghost { background: var(--surface); border: 1px solid var(--border); }
    .picker {
      display: flex; align-items: center; justify-content: center; gap: 0.6rem;
      margin: 0 0 1.1rem;
      font-size: 0.82rem; color: var(--muted);
    }
    .picker button {
      width: 30px; height: 30px; border-radius: 50%;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--text); font: inherit; font-size: 1rem; cursor: pointer;
    }
    .picker button:hover { border-color: rgba(255,255,255,0.22); }
    .picker b { color: var(--text); font-size: 1.05rem; min-width: 2ch; display: inline-block; }
    .hint { margin-top: 0.9rem; font-size: 0.72rem; color: var(--muted); }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<a class="back" href="../index.html">← arcade</a>
<div id="overlay"><div class="card" id="card"></div></div>

<script>
// ─────────────────────────────────────────────────
//  FIELD (logical units; scaled to fit the screen)
// ─────────────────────────────────────────────────
const FW = 400, FH = 680;
const HUD_H = 52;                    // top band for score/level/lives
const PADDLE_Y = FH - 56, PADDLE_H = 12, PADDLE_W = 76;
const BALL_R = 6;
const COLS = 32, GRID_ROWS = 28;        // dot grid
const DOT = 10, PITCH = 12;              // dot diameter, spacing
const DOT_R = DOT / 2;
const BRICK_LEFT = (FW - (COLS * PITCH - (PITCH - DOT))) / 2;
const BRICK_TOP = HUD_H + 30;
const SHIELD_Y = FH - 18;
const MAX_BALLS = 60;
const MAX_START = 99;   // highest level the menu lets you jump to

const C = {
  bg: '#1A1A2E', orange: '#C8572E', yellow: '#C99A30', green: '#3A8F72', indigo: '#6366F1',
  pink: '#B85C8A', purple: '#7A5BB0', muted: '#9CA3AF', white: '#F9FAFB', steel: '#5B6275', teal: '#2FA3A3',
};
const PALETTE = {
  r: C.orange, o: '#E08A3C', y: C.yellow, g: C.green, l: '#7BC47F', b: C.indigo,
  c: '#4FB3D9', p: C.pink, v: C.purple, w: '#ECEDF2', n: '#8B5A3C', k: '#2B2E44',
};

const POWERS = {
  wide:   { label: 'W',  color: C.green,  name: 'Wide paddle' },
  multi:  { label: '×3', color: C.yellow, name: 'Every ball ×3' },
  plus3:  { label: '+3', color: '#E8C25A', name: '+3 balls' },
  slow:   { label: 'S',  color: C.indigo, name: 'Slow ball' },
  fire:   { label: 'F',  color: C.orange, name: 'Fireball' },
  shield: { label: '▁',  color: C.teal,   name: 'Shield' },
  life:   { label: '♥',  color: C.white,  name: 'Extra ball' },
  shrink: { label: '↯',  color: C.pink,   name: 'Shrink (trap!)' },
};
const DROP_TABLE = [['multi', 22], ['plus3', 24], ['wide', 12], ['slow', 8], ['fire', 10], ['shield', 9], ['shrink', 12], ['life', 3]];

// ─────────────────────────────────────────────────
//  CANVAS
// ─────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, DPR, scale = 1, ox = 0, oy = 0;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  scale = Math.min(W / FW, H / FH);
  ox = (W - FW * scale) / 2;
  oy = (H - FH * scale) / 2;
}
window.addEventListener('resize', resize);
resize();

// ─────────────────────────────────────────────────
//  AUDIO
// ─────────────────────────────────────────────────
let AC = null, muted = false;
function ensureAudio() {
  if (AC) return;
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch {}
}
function tone(freq, dur, { type = 'square', vol = 0.06, to = null, delay = 0 } = {}) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(AC.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
const sfx = {
  paddle: () => tone(330, 0.06, { type: 'triangle', vol: 0.12 }),
  brick:  (combo) => tone(520 + Math.min(combo, 20) * 30, 0.05, { vol: 0.05 }),
  steel:  () => tone(1200, 0.04, { type: 'triangle', vol: 0.05 }),
  boom:   () => tone(140, 0.3, { type: 'sawtooth', vol: 0.1, to: 40 }),
  power:  () => { tone(660, 0.08, { type: 'triangle', vol: 0.1 }); tone(990, 0.12, { type: 'triangle', vol: 0.1, delay: 0.07 }); },
  trap:   () => tone(400, 0.25, { type: 'triangle', vol: 0.12, to: 150 }),
  lose:   () => tone(300, 0.45, { type: 'triangle', vol: 0.14, to: 80 }),
  clear:  () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.18, { type: 'triangle', vol: 0.12, delay: i * 0.08 })),
};

// ─────────────────────────────────────────────────
//  STORAGE (optional)
// ─────────────────────────────────────────────────
function load(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }

// ─────────────────────────────────────────────────
//  LEVELS
// ─────────────────────────────────────────────────
// Seeded so each level number always builds the same layout.
function rng(seed) {
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// Pixel-art pictures. Each row is the LEFT half (8 cells); the right half
// mirrors it, and every cell becomes a 2×2 block of dots (32 dots across).
// Letters are colors from PALETTE; '.' is empty.
const PICTURES = [
  { name: 'Heart', rows: [
    '........', '..rrrr..', '.rrwwrr.', '.rwwrrrr', '.rrrrrrr', '.rrrrrrr',
    '..rrrrrr', '...rrrrr', '....rrrr', '.....rrr', '......rr', '.......r'] },
  { name: 'Star', rows: [
    '.......y', '.......y', '......yy', '......yy', 'yyyyyyyy', '.yyyyyyy',
    '...yyyyy', '....yyyy', '....yyyy', '...yyyy.', '..yyy...', '.yy.....'] },
  { name: 'Smiley', rows: [
    '.....yyy', '...yyyyy', '..yyyyyy', '.yyyykky', '.yyyykky', 'yyyyyyyy',
    'yyyyyyyy', 'yykyyyyy', '.yykkyyy', '..yyykkk', '...yyyyy', '.....yyy'] },
  { name: 'Rocket', rows: [
    '.......w', '......ww', '.....wwb', '.....wbc', '.....wbc', '.....wwb', '.....www',
    '....rwww', '...rrwww', '..rrrwww', '.....oyy', '......oy', '.......o'] },
  { name: 'Tree', rows: [
    '.......g', '......gg', '.....ggl', '....gggg', '.....ggg', '....gggg', '...ggggg',
    '....gggg', '...ggggl', '..gggggg', '.......n', '.......n', '......nn'] },
  { name: 'House', rows: [
    '.......r', '......rr', '.....rrr', '....rrrr', '...rrrrr', '..rrrrrr',
    '...wwwww', '...wccww', '...wccww', '...wwwwn', '...wwwwn', '...wwwwn'] },
  { name: 'Crown', rows: [
    '........', '.y......', '.yy....y', '.yyy..yy', '.yyyyyyy', '.yyyyyyy',
    '.ypyyyyb', '.yyyyyyy', '.wwwwwww', '.wwwwwww'] },
  { name: 'Gem', rows: [
    '...ccccc', '..cwcccc', '.cwccccc', 'cccccccc', '.bcccccc', '..bccccc',
    '...bcccc', '....bccc', '.....bcc', '......bc', '.......c'] },
  { name: 'Apple', rows: [
    '.......n', '......ln', '....lll.', '..rrrrrr', '.rwrrrrr', 'rwrrrrrr',
    'rrrrrrrr', 'rrrrrrrr', '.rrrrrrr', '..rrrrrr', '...rrr.r'] },
  { name: 'Cat', rows: [
    '.v......', '.vv.....', '.vvv....', '.vvvvvvv', 'vvvvvvvv', 'vvwkvvvv',
    'vvkkvvvv', 'vvvvvvvp', 'vvvvvvvv', '.vvvwvvv', '..vvvvvv', '....vvvv'] },
];

// Generated dot patterns for later levels: (x, y) on a 32 × rows grid → filled?
const PATTERNS = [
  (x, y, R) => { const d = Math.hypot(x - 15.5, (y - (R - 1) / 2) * 1.3); return d < 15 && Math.floor(d) % 4 < 2; },  // rings
  (x, y, R) => Math.abs(y - R / 2 - Math.sin(x / 3) * 4) < 4,                                               // wave
  (x, y) => ((x >> 2) + (y >> 2)) % 2 === 0,                                                               // blocks
  (x, y, R) => Math.abs(x - 15.5) / 16 + Math.abs(y - (R - 1) / 2) / (R / 2) < 1 && (x + y) % 2 === 0,      // lattice diamond
  (x, y, R, rand) => rand() < 0.55,                                                                         // scatter
  (x, y) => (y % 6 < 3) !== (x < 16 ? x % 8 < 4 : (31 - x) % 8 < 4),                                       // weave
];
const PATTERN_COLORS = ['g', 'l', 'c', 'b', 'v', 'p', 'r', 'o', 'y'];

/** Builds a level as dots on a 32-column grid. */
function buildLevel(level) {
  const rand = rng(level * 7919 + 13);
  const cells = [];   // [x, y, colorChar]

  // Levels 1–10 are the pictures in order; after that pictures and patterns alternate.
  const usePicture = level <= PICTURES.length || level % 2 === 0;
  if (usePicture) {
    const pic = PICTURES[level <= PICTURES.length ? level - 1 : Math.floor(rand() * PICTURES.length)];
    pic.rows.forEach((half, r) => {
      const row = half + [...half].reverse().join('');
      [...row].forEach((ch, c) => {
        if (ch === '.') return;
        for (let dy = 0; dy < 2; dy++) for (let dx = 0; dx < 2; dx++) cells.push([c * 2 + dx, r * 2 + dy, ch]);
      });
    });
  } else {
    const rows = Math.min(14 + Math.floor(level / 4), 26);
    const shape = PATTERNS[Math.floor(rand() * PATTERNS.length)];
    const offset = Math.floor(rand() * PATTERN_COLORS.length);
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < COLS / 2; x++) {
        if (!shape(x, y, rows, rand)) continue;
        const ch = PATTERN_COLORS[(Math.floor(y / 3) + offset) % PATTERN_COLORS.length];
        cells.push([x, y, ch], [COLS - 1 - x, y, ch]);
      }
    }
  }

  // Difficulty: tougher dots, steel and bombs creep in as levels go up.
  const p2 = level >= 4 ? Math.min(0.35, (level - 3) * 0.03) : 0;
  const p3 = level >= 12 ? Math.min(0.2, (level - 11) * 0.02) : 0;
  const pSteel = level >= 6 ? Math.min(0.05, (level - 5) * 0.004) : 0;
  const pBomb = level >= 3 ? 0.015 : 0;

  const grid = new Array(COLS * GRID_ROWS).fill(null);
  const bricks = [];
  for (const [x, y, ch] of cells) {
    if (y >= GRID_ROWS || grid[y * COLS + x]) continue;
    const roll = rand();
    let kind = 'normal', hp = 1;
    if (roll < pSteel) kind = 'steel';
    else if (roll < pSteel + pBomb) kind = 'bomb';
    else { const h = rand(); hp = h < p3 ? 3 : h < p3 + p2 ? 2 : 1; }
    const b = {
      c: x, r: y, kind, hp, max: hp, flash: 0,
      color: kind === 'steel' ? C.steel : kind === 'bomb' ? C.pink : PALETTE[ch],
      cx: BRICK_LEFT + x * PITCH + DOT / 2, cy: BRICK_TOP + y * PITCH + DOT / 2,
    };
    grid[y * COLS + x] = b;
    bricks.push(b);
  }
  if (!bricks.some(b => b.kind !== 'steel')) bricks.forEach(b => { b.kind = 'normal'; b.hp = b.max = 1; b.color = C.green; });
  return { bricks, grid, alive: bricks.filter(b => b.kind !== 'steel').length };
}

// ─────────────────────────────────────────────────
//  STATE
// ─────────────────────────────────────────────────
let state = 'menu';   // menu | ready | playing | paused | cleared | over
const G = {
  level: 1, score: 0, lives: 3, combo: 0,
  bricks: [], grid: [], alive: 0, balls: [], drops: [], particles: [],
  paddle: { x: FW / 2, w: PADDLE_W, target: FW / 2 },
  fx: { wide: 0, shrink: 0, slow: 0, fire: 0 },
  shield: false, shake: 0, banner: null, clearAt: 0,
};

const ballSpeed = () => 330 * (1 + Math.min(0.5, (G.level - 1) * 0.03)) * (G.fx.slow > 0 ? 0.68 : 1);

function newGame(level = 1) {
  G.level = level; G.score = 0; G.lives = 3;
  startLevel();
}

function startLevel() {
  Object.assign(G, buildLevel(G.level));
  G.drops = []; G.particles = [];
  G.fx = { wide: 0, shrink: 0, slow: 0, fire: 0 };
  G.shield = false;
  G.banner = { text: `Level ${G.level}`, t: now() };
  save('shatter-level', Math.max(load('shatter-level', 1), G.level));
  resetBall();
  hideCard();
}

function resetBall() {
  G.combo = 0;
  G.balls = [{ x: G.paddle.x, y: PADDLE_Y - BALL_R - 1, vx: 0, vy: 0, stuck: true, trail: [] }];
  state = 'ready';
}

function launch() {
  if (state !== 'ready') return;
  const b = G.balls[0];
  // Angle leans toward where the paddle is heading, with a little randomness.
  const lean = Math.max(-1, Math.min(1, (G.paddle.target - G.paddle.x) / 40));
  const a = (lean * 25 + (Math.random() * 20 - 10)) * Math.PI / 180;
  const s = ballSpeed();
  b.vx = Math.sin(a) * s; b.vy = -Math.cos(a) * s; b.stuck = false;
  state = 'playing';
}

const now = () => performance.now() / 1000;

// ─────────────────────────────────────────────────
//  UPDATE
// ─────────────────────────────────────────────────
function update(dt) {
  updatePaddle(dt);
  updateParticles(dt);
  if (state === 'cleared') {
    if (now() - G.clearAt > 1.6) { G.level++; startLevel(); }
    return;
  }
  if (state !== 'playing' && state !== 'ready') return;

  for (const k in G.fx) G.fx[k] = Math.max(0, G.fx[k] - dt);
  G.shake = Math.max(0, G.shake - dt * 30);

  for (const b of G.balls) {
    if (b.stuck) { b.x = G.paddle.x; b.y = PADDLE_Y - BALL_R - 1; continue; }
    moveBall(b, dt);
  }
  G.balls = G.balls.filter(b => b.y < FH + 20);

  updateDrops(dt);

  if (!G.balls.length) {
    G.lives--;
    sfx.lose();
    G.shake = 8;
    if (G.lives <= 0) return gameOver();
    G.fx = { wide: 0, shrink: 0, slow: 0, fire: 0 };
    G.drops = [];
    resetBall();
    return;
  }

  if (G.alive <= 0) levelCleared();
}

function updatePaddle(dt) {
  const p = G.paddle;
  if (keys.left) p.target -= 520 * dt;
  if (keys.right) p.target += 520 * dt;
  const wantW = PADDLE_W * (G.fx.wide > 0 ? 1.55 : G.fx.shrink > 0 ? 0.62 : 1);
  p.w += (wantW - p.w) * Math.min(1, dt * 10);
  p.target = Math.max(p.w / 2 + 4, Math.min(FW - p.w / 2 - 4, p.target));
  p.x += (p.target - p.x) * Math.min(1, dt * 22);
}

function moveBall(b, dt) {
  const speed = Math.hypot(b.vx, b.vy);
  const steps = Math.max(1, Math.ceil(speed * dt / 3));
  const h = dt / steps;
  for (let i = 0; i < steps; i++) {
    const px = b.x, py = b.y;
    b.x += b.vx * h; b.y += b.vy * h;

    // Walls.
    if (b.x < BALL_R) { b.x = BALL_R; b.vx = Math.abs(b.vx); }
    if (b.x > FW - BALL_R) { b.x = FW - BALL_R; b.vx = -Math.abs(b.vx); }
    if (b.y < HUD_H + BALL_R) { b.y = HUD_H + BALL_R; b.vy = Math.abs(b.vy); }

    // Paddle: where it lands sets the bounce angle.
    const p = G.paddle;
    if (b.vy > 0 && b.y + BALL_R >= PADDLE_Y && py + BALL_R <= PADDLE_Y + 2 &&
        b.x >= p.x - p.w / 2 - BALL_R && b.x <= p.x + p.w / 2 + BALL_R) {
      const hit = Math.max(-1, Math.min(1, (b.x - p.x) / (p.w / 2)));
      const a = hit * 62 * Math.PI / 180;
      const s = ballSpeed();
      b.vx = Math.sin(a) * s; b.vy = -Math.cos(a) * s;
      b.y = PADDLE_Y - BALL_R;
      G.combo = 0;
      sfx.paddle();
    }

    // Shield catches one ball.
    if (G.shield && b.vy > 0 && b.y + BALL_R >= SHIELD_Y) {
      b.y = SHIELD_Y - BALL_R; b.vy = -Math.abs(b.vy);
      G.shield = false;
      burst(b.x, SHIELD_Y, C.teal, 14);
      sfx.steel();
    }

    // Dots near the ball (grid lookup), treated as circles.
    const c0 = Math.floor((b.x - BALL_R - BRICK_LEFT) / PITCH), c1 = Math.floor((b.x + BALL_R - BRICK_LEFT) / PITCH);
    const r0 = Math.floor((b.y - BALL_R - BRICK_TOP) / PITCH), r1 = Math.floor((b.y + BALL_R - BRICK_TOP) / PITCH);
    let bounced = false;
    for (let r = Math.max(0, r0); r <= Math.min(GRID_ROWS - 1, r1) && !bounced; r++) {
      for (let c = Math.max(0, c0); c <= Math.min(COLS - 1, c1); c++) {
        const br = G.grid[r * COLS + c];
        if (!br) continue;
        const dx = b.x - br.cx, dy = b.y - br.cy, d = Math.hypot(dx, dy);
        if (d >= BALL_R + DOT_R) continue;
        const fire = G.fx.fire > 0 && br.kind !== 'steel';
        hitBrick(br, fire);
        if (fire) continue;
        const nx = d > 0.001 ? dx / d : 0, ny = d > 0.001 ? dy / d : -1;
        const into = b.vx * nx + b.vy * ny;
        if (into < 0) { b.vx -= 2 * into * nx; b.vy -= 2 * into * ny; }
        b.x = br.cx + nx * (BALL_R + DOT_R); b.y = br.cy + ny * (BALL_R + DOT_R);
        bounced = true;
        break;
      }
    }
  }

  // Keep the ball from sliding along nearly flat forever.
  const s = ballSpeed(), minVy = s * 0.28;
  if (Math.abs(b.vy) < minVy) {
    b.vy = Math.sign(b.vy || -1) * minVy;
    b.vx = Math.sign(b.vx || 1) * Math.sqrt(Math.max(0, s * s - minVy * minVy));
  }
  // Ease toward the current target speed (slow power-up, level speed).
  const cur = Math.hypot(b.vx, b.vy) || 1;
  const k = (cur + (s - cur) * Math.min(1, dt * 3)) / cur;
  b.vx *= k; b.vy *= k;

  b.trail.push([b.x, b.y]);
  if (b.trail.length > 8) b.trail.shift();
}

function hitBrick(br, fire) {
  if (br.hp <= 0) return;
  if (br.kind === 'steel') { br.flash = 1; sfx.steel(); return; }
  br.hp = fire ? 0 : br.hp - 1;
  br.flash = 1;
  if (br.hp > 0) { sfx.brick(G.combo); return; }

  // Popped: take it off the grid.
  G.grid[br.r * COLS + br.c] = null;
  G.alive--;
  G.combo++;
  G.score += Math.round(5 * br.max * (1 + Math.min(G.combo, 50) * 0.05));
  burst(br.cx, br.cy, br.color, 4);
  if (!fire || Math.random() < 0.3) sfx.brick(G.combo);
  maybeDrop(br.cx, br.cy);

  if (br.kind === 'bomb') {
    // Clears a 5×5 patch around it (except steel), and can chain.
    sfx.boom();
    G.shake = 6;
    burst(br.cx, br.cy, C.orange, 22);
    for (let r = br.r - 2; r <= br.r + 2; r++) {
      for (let c = br.c - 2; c <= br.c + 2; c++) {
        const o = r >= 0 && r < GRID_ROWS && c >= 0 && c < COLS ? G.grid[r * COLS + c] : null;
        if (o && o.kind !== 'steel') hitBrick(o, true);
      }
    }
  }
}

function maybeDrop(x, y) {
  if (Math.random() > 0.07) return;
  const total = DROP_TABLE.reduce((s, [, w]) => s + w, 0);
  let roll = Math.random() * total;
  for (const [type, w] of DROP_TABLE) {
    if ((roll -= w) < 0) { G.drops.push({ type, x, y }); return; }
  }
}

function updateDrops(dt) {
  const p = G.paddle;
  for (const d of G.drops) {
    d.y += 150 * dt;
    if (d.y + 8 >= PADDLE_Y && d.y - 8 <= PADDLE_Y + PADDLE_H && Math.abs(d.x - p.x) <= p.w / 2 + 14) {
      applyPower(d.type);
      d.caught = true;
    }
  }
  G.drops = G.drops.filter(d => !d.caught && d.y < FH + 20);
}

function applyPower(type) {
  const info = POWERS[type];
  G.banner = { text: info.name, t: now(), color: info.color, small: true };
  if (type === 'shrink') { G.fx.shrink = 10; G.fx.wide = 0; sfx.trap(); return; }
  sfx.power();
  switch (type) {
    case 'wide': G.fx.wide = 14; G.fx.shrink = 0; break;
    case 'slow': G.fx.slow = 10; break;
    case 'fire': G.fx.fire = 7; break;
    case 'shield': G.shield = true; break;
    case 'life': G.lives = Math.min(6, G.lives + 1); break;
    case 'plus3': {
      // Three fresh balls fired up from the paddle.
      const s = ballSpeed();
      for (const deg of [-22, 0, 22]) {
        if (G.balls.length >= MAX_BALLS) break;
        const a = deg * Math.PI / 180;
        G.balls.push({ x: G.paddle.x, y: PADDLE_Y - BALL_R - 1, vx: Math.sin(a) * s, vy: -Math.cos(a) * s, stuck: false, trail: [] });
      }
      if (state === 'ready') state = 'playing';
      break;
    }
    case 'multi': {
      const extra = [];
      for (const b of G.balls) {
        if (b.stuck) continue;
        for (const turn of [-0.4, 0.4]) {
          if (G.balls.length + extra.length >= MAX_BALLS) break;
          const c = Math.cos(turn), s = Math.sin(turn);
          extra.push({ x: b.x, y: b.y, vx: b.vx * c - b.vy * s, vy: b.vx * s + b.vy * c, stuck: false, trail: [] });
        }
      }
      G.balls.push(...extra);
      break;
    }
  }
}

function burst(x, y, color, n) {
  n = Math.min(n, 500 - G.particles.length);   // cap for big chain reactions
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 40 + Math.random() * 160;
    G.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, life: 0.5 + Math.random() * 0.4, t: 0, color });
  }
}

function updateParticles(dt) {
  for (const p of G.particles) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 420 * dt; }
  G.particles = G.particles.filter(p => p.t < p.life);
  for (const b of G.bricks) b.flash = Math.max(0, b.flash - dt * 6);
  if (G.bricks.length > 0 && G.bricks.length > G.alive * 2 + 50) G.bricks = G.bricks.filter(b => b.hp > 0 || b.kind === 'steel');
}

function levelCleared() {
  state = 'cleared';
  G.clearAt = now();
  const bonus = 250 * G.level + G.lives * 100;
  G.score += bonus;
  G.banner = { text: `Level ${G.level} cleared · +${bonus}`, t: now(), color: C.yellow };
  sfx.clear();
}

function gameOver() {
  state = 'over';
  const best = load('shatter-best', 0);
  const isBest = G.score > best;
  if (isBest) save('shatter-best', G.score);
  setTimeout(() => showOver(isBest, Math.max(best, G.score)), 600);
}

// ─────────────────────────────────────────────────
//  CARDS
// ─────────────────────────────────────────────────
const overlay = document.getElementById('overlay');
const card = document.getElementById('card');
function hideCard() { overlay.classList.add('hidden'); }
function showCard(html, buttons) {
  card.innerHTML = html + `<div class="btns">${buttons.map((b, i) =>
    `<button class="btn ${b.ghost ? 'ghost' : ''}" data-i="${i}">${b.label}</button>`).join('')}</div>`;
  card.querySelectorAll('.btn').forEach(el => el.addEventListener('click', e => {
    e.stopPropagation(); ensureAudio(); buttons[+el.dataset.i].run();
  }));
  overlay.classList.remove('hidden');
}

const pill = type => `<span class="pill" style="background:${POWERS[type].color}">${POWERS[type].label}</span>`;

function showMenu() {
  state = 'menu';
  const reached = load('shatter-level', 1), best = load('shatter-best', 0);
  const buttons = [{ label: 'Play', run: () => newGame(pickedLevel) }];
  if (reached > 1) buttons.push({ label: `Continue · level ${reached}`, ghost: true, run: () => newGame(reached) });
  showCard(`
    <h1>Shat<em>ter</em></h1>
    <p class="sub">Pop every dot. Catch power-ups and let the balls multiply.</p>
    <div class="legend">
      ${['multi', 'plus3', 'wide', 'fire', 'slow', 'shield', 'life', 'shrink'].map(t => `<div>${pill(t)}<span>${POWERS[t].name}</span></div>`).join('')}
    </div>
    ${pickerHTML()}
  `, buttons);
  wirePicker();
  card.insertAdjacentHTML('beforeend', `<p class="hint">Move: mouse, finger or ← → · Launch: click, tap or space${best ? ` · Best ${best.toLocaleString()}` : ''}</p>`);
}

function showPause() {
  if (state !== 'playing' && state !== 'ready') return;
  G.pausedFrom = state;
  state = 'paused';
  showCard(`<h1>Paused</h1><p class="sub">Level ${G.level} · ${G.score.toLocaleString()} points</p>`, [
    { label: 'Resume', run: resume },
    { label: 'Quit', ghost: true, run: showMenu },
  ]);
}
function resume() { state = G.pausedFrom || 'ready'; hideCard(); }

function showOver(isBest, best) {
  showCard(`
    <h1>Game <em>over</em></h1>
    <p class="sub">You reached level ${G.level}.</p>
    <div class="lines">
      <div><span>Score</span><span>${G.score.toLocaleString()}</span></div>
      <div><span>${isBest ? 'New best!' : 'Best'}</span><span>${best.toLocaleString()}</span></div>
    </div>
  `, [
    { label: 'Play again', run: () => newGame(pickedLevel) },
    { label: `Retry level ${G.level}`, ghost: true, run: () => newGame(G.level) },
  ]);
}

// ─────────────────────────────────────────────────
//  LEVEL PICKER (menu stepper; ?level=N in the URL preselects it)
// ─────────────────────────────────────────────────
const clampLevel = n => Math.max(1, Math.min(MAX_START, Math.floor(+n) || 1));
let pickedLevel = clampLevel(new URLSearchParams(location.search).get('level') || 1);
const pickerHTML = () =>
  `<div class="picker">Start at level <button data-step="-1" aria-label="Lower level">−</button><b id="picked">${pickedLevel}</b><button data-step="1" aria-label="Higher level">+</button></div>`;
function wirePicker() {
  card.querySelectorAll('.picker button').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    pickedLevel = clampLevel(pickedLevel + +b.dataset.step);
    card.querySelector('#picked').textContent = pickedLevel;
  }));
}

// ─────────────────────────────────────────────────
//  INPUT
// ─────────────────────────────────────────────────
const keys = { left: false, right: false };
const toField = clientX => (clientX - ox) / scale;

window.addEventListener('pointermove', e => {
  if (state === 'playing' || state === 'ready') G.paddle.target = toField(e.clientX);
});
canvas.addEventListener('pointerdown', e => {
  ensureAudio();
  if (state === 'playing' || state === 'ready') G.paddle.target = toField(e.clientX);
  if (state === 'ready') launch();
});

window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
  if (e.key === ' ') { e.preventDefault(); ensureAudio(); if (state === 'ready') launch(); else if (state === 'paused') resume(); }
  if (e.key === 'p' || e.key === 'Escape') { if (state === 'paused') resume(); else showPause(); }
  if (e.key === 'm') muted = !muted;
});
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
});
window.addEventListener('blur', showPause);
document.addEventListener('visibilitychange', () => { if (document.hidden) showPause(); });

// ─────────────────────────────────────────────────
//  DRAW
// ─────────────────────────────────────────────────
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h);
}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, W, H);

  const shake = G.shake > 0 ? (Math.random() - 0.5) * G.shake : 0;
  ctx.setTransform(DPR * scale, 0, 0, DPR * scale, DPR * (ox + shake), DPR * oy);

  // Field.
  ctx.fillStyle = 'rgba(255,255,255,0.03)';
  rrect(0, 0, FW, FH, 18); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.save();
  rrect(0, 0, FW, FH, 18); ctx.clip();

  drawHUD();
  drawBricks();
  drawDrops();
  drawShield();
  drawPaddle();
  drawBalls();
  drawParticles();
  drawBanner();
  if (state === 'ready') {
    ctx.fillStyle = 'rgba(249,250,251,0.75)';
    ctx.font = '500 13px "Space Grotesk", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Tap, click or press space to launch', FW / 2, PADDLE_Y + 34);
  }
  ctx.restore();
}

function drawHUD() {
  ctx.fillStyle = 'rgba(255,255,255,0.04)';
  ctx.fillRect(0, 0, FW, HUD_H);
  ctx.textBaseline = 'middle';
  ctx.font = '700 18px "Space Grotesk", sans-serif';
  ctx.fillStyle = C.white;
  ctx.textAlign = 'left';
  ctx.fillText(G.score.toLocaleString(), 16, HUD_H / 2 + 6);
  ctx.font = '500 9px "Space Grotesk", sans-serif';
  ctx.fillStyle = C.muted;
  ctx.fillText('SCORE', 16, 13);

  ctx.textAlign = 'center';
  ctx.fillText('LEVEL', FW / 2, 13);
  ctx.font = 'italic 400 20px Fraunces, Georgia, serif';
  ctx.fillStyle = C.yellow;
  ctx.fillText(G.level, FW / 2, HUD_H / 2 + 6);

  // Lives as small balls.
  ctx.textAlign = 'right';
  ctx.font = '500 9px "Space Grotesk", sans-serif';
  ctx.fillStyle = C.muted;
  ctx.fillText('BALLS', FW - 16, 13);
  for (let i = 0; i < G.lives; i++) {
    ctx.fillStyle = C.white;
    ctx.beginPath();
    ctx.arc(FW - 20 - i * 14, HUD_H / 2 + 6, 4.5, 0, Math.PI * 2);
    ctx.fill();
  }

  // Combo + active power-ups under the HUD.
  let x = 12;
  const y = HUD_H + 13;
  ctx.textAlign = 'left';
  ctx.font = '600 10px "Space Grotesk", sans-serif';
  if (G.combo >= 3) {
    ctx.fillStyle = C.yellow;
    ctx.fillText(`COMBO ×${(1 + G.combo * 0.1).toFixed(1)}`, x, y);
    x += 82;
  }
  const active = [['wide', G.fx.wide, 14], ['shrink', G.fx.shrink, 10], ['slow', G.fx.slow, 10], ['fire', G.fx.fire, 7]];
  for (const [type, t, full] of active) {
    if (t <= 0) continue;
    ctx.fillStyle = POWERS[type].color;
    rrect(x, y - 6, 46, 12, 6); ctx.globalAlpha = 0.25; ctx.fill(); ctx.globalAlpha = 1;
    rrect(x, y - 6, 46 * (t / full), 12, 6); ctx.fill();
    ctx.fillStyle = C.bg;
    ctx.fillText(POWERS[type].label, x + 5, y + 0.5);
    x += 52;
  }
}

function drawBricks() {
  for (const b of G.bricks) {
    if (b.hp <= 0) continue;
    ctx.fillStyle = b.color;
    ctx.beginPath(); ctx.arc(b.cx, b.cy, DOT_R, 0, Math.PI * 2); ctx.fill();
    if (b.kind === 'steel') {
      ctx.strokeStyle = 'rgba(255,255,255,0.45)';
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(b.cx, b.cy, DOT_R - 2, 0, Math.PI * 2); ctx.stroke();
    } else if (b.kind === 'bomb') {
      ctx.fillStyle = C.bg;
      ctx.beginPath(); ctx.arc(b.cx, b.cy, 2.2, 0, Math.PI * 2); ctx.fill();
    } else if (b.hp > 1) {
      // Tough dots: a ring per extra hit left.
      ctx.strokeStyle = 'rgba(26,26,46,0.6)';
      ctx.lineWidth = 1.3;
      for (let i = 1; i < b.hp; i++) { ctx.beginPath(); ctx.arc(b.cx, b.cy, DOT_R - 1.5 * i - 0.5, 0, Math.PI * 2); ctx.stroke(); }
    } else {
      ctx.fillStyle = 'rgba(255,255,255,0.28)';
      ctx.beginPath(); ctx.arc(b.cx - 1.6, b.cy - 1.6, 1.6, 0, Math.PI * 2); ctx.fill();
    }
    if (b.flash > 0) {
      ctx.fillStyle = `rgba(255,255,255,${0.7 * b.flash})`;
      ctx.beginPath(); ctx.arc(b.cx, b.cy, DOT_R, 0, Math.PI * 2); ctx.fill();
    }
  }
}

function drawDrops() {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '700 10px "Space Grotesk", sans-serif';
  for (const d of G.drops) {
    const info = POWERS[d.type];
    ctx.shadowColor = info.color; ctx.shadowBlur = 10;
    ctx.fillStyle = info.color;
    rrect(d.x - 15, d.y - 8, 30, 16, 8); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = C.bg;
    ctx.fillText(info.label, d.x, d.y + 0.5);
  }
}

function drawShield() {
  if (!G.shield) return;
  ctx.strokeStyle = C.teal;
  ctx.lineWidth = 3;
  ctx.shadowColor = C.teal; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.moveTo(8, SHIELD_Y); ctx.lineTo(FW - 8, SHIELD_Y); ctx.stroke();
  ctx.shadowBlur = 0;
}

function drawPaddle() {
  const p = G.paddle;
  const g = ctx.createLinearGradient(0, PADDLE_Y, 0, PADDLE_Y + PADDLE_H);
  g.addColorStop(0, C.white); g.addColorStop(1, '#C9CBD6');
  ctx.shadowColor = G.fx.shrink > 0 ? C.pink : G.fx.wide > 0 ? C.green : 'rgba(255,255,255,0.4)';
  ctx.shadowBlur = 14;
  ctx.fillStyle = g;
  rrect(p.x - p.w / 2, PADDLE_Y, p.w, PADDLE_H, PADDLE_H / 2); ctx.fill();
  ctx.shadowBlur = 0;
}

function drawBalls() {
  const fire = G.fx.fire > 0;
  for (const b of G.balls) {
    for (let i = 0; i < b.trail.length; i++) {
      const [tx, ty] = b.trail[i], k = (i + 1) / b.trail.length;
      ctx.globalAlpha = 0.25 * k;
      ctx.fillStyle = fire ? C.orange : C.white;
      ctx.beginPath(); ctx.arc(tx, ty, BALL_R * k, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.shadowColor = fire ? C.orange : 'rgba(255,255,255,0.8)';
    ctx.shadowBlur = fire ? 16 : 8;
    ctx.fillStyle = fire ? '#FFD9A8' : C.white;
    ctx.beginPath(); ctx.arc(b.x, b.y, BALL_R, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
  }
}

function drawParticles() {
  for (const p of G.particles) {
    ctx.globalAlpha = 1 - p.t / p.life;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;
}

function drawBanner() {
  const b = G.banner;
  if (!b) return;
  const age = now() - b.t;
  if (age > 1.6) { G.banner = null; return; }
  ctx.globalAlpha = Math.min(1, (1.6 - age) / 0.4, age / 0.12);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = b.small ? 'italic 400 22px Fraunces, Georgia, serif' : 'italic 400 30px Fraunces, Georgia, serif';
  ctx.fillStyle = b.color || C.white;
  ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 8;
  ctx.fillText(b.text, FW / 2, FH * 0.62 - age * 14);
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
}

// ─────────────────────────────────────────────────
//  LOOP
// ─────────────────────────────────────────────────
let last = 0;
function frame(ms) {
  const t = ms / 1000;
  const dt = last ? Math.min(t - last, 1 / 30) : 1 / 60;
  last = t;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

// A live level sits behind the menu.
Object.assign(G, buildLevel(1));
G.balls = [{ x: FW / 2, y: PADDLE_Y - BALL_R - 1, vx: 0, vy: 0, stuck: true, trail: [] }];
showMenu();
requestAnimationFrame(frame);
</script>
</body>
</html>
